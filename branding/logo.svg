<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#sheen)"/>

  <!-- connection X: two crossing rounded links with endpoint nodes -->
  <g filter="url(#soft)" stroke="#ffffff" stroke-width="40" stroke-linecap="round">
    <line x1="176" y1="176" x2="336" y2="336"/>
    <line x1="336" y1="176" x2="176" y2="336"/>
  </g>
  <!-- endpoint nodes (remote endpoints) -->
  <g fill="#ffffff">
    <circle cx="176" cy="176" r="34"/>
    <circle cx="336" cy="176" r="34"/>
    <circle cx="176" cy="336" r="34"/>
    <circle cx="336" cy="336" r="34"/>
  </g>
  <!-- center hub -->
  <circle cx="256" cy="256" r="30" fill="#06B6D4" stroke="#ffffff" stroke-width="12"/>
</svg>
